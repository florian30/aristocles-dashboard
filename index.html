<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aristocles · Suivi des testeurs</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23C75A3C'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-weight='600' font-size='20' fill='%23FAF6EE' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E">
<style>
  /* ---- Aristocles core tokens (design system) ---- */
  @font-face {
    font-family: "Inter";
    src: url("fonts/Inter-VariableFont_opsz_wght.ttf") format("truetype-variations");
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "Fraunces";
    src: url("fonts/Fraunces-VariableFont_SOFT_WONK_opsz_wght.ttf") format("truetype-variations");
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }

  :root {
    --terracotta:      #C75A3C;
    --olive-deep:      #5F6B3C;
    --olive-light:     #7B8A4D;
    --cream:           #FAF6EE;
    --sand:            #EDE5D3;
    --border:          #D6CDB9;

    --ink:             #3D2E1F;
    --ink-soft:        #7A6952;
    --ink-placeholder: #A89C84;

    --error:           #A6442E;
    --info:            #6B7B9A;
    --success:         #7B8A4D;

    --surface-raised:  #F3ECDB;
    --field-bg:        #FFFFFF;

    --font-display: "Fraunces", "Cormorant Garamond", Georgia, serif;
    --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  h2 {
    font-family: var(--font-display);
    color: var(--ink);
    font-weight: 600;
    letter-spacing: -0.015em;
    line-height: 1.3;
    margin: 0;
    text-wrap: balance;
  }

  a {
    color: var(--olive-deep);
    text-decoration: underline;
    text-underline-offset: 2px;
    text-decoration-thickness: 1px;
    text-decoration-color: rgba(95, 107, 60, 0.45);
  }
  a:hover { text-decoration-color: var(--olive-deep); }

  button { font-family: var(--font-body); }

  input::placeholder { color: var(--ink-placeholder); }
  :focus-visible { outline: 2px solid var(--olive-deep); outline-offset: 2px; }
  input[type="date"]::-webkit-calendar-picker-indicator { opacity: 0.55; }

  .eyebrow {
    font-family: var(--font-body);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .wordmark {
    font-family: var(--font-display);
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--ink);
  }

  [hidden] { display: none !important; }

  /* ---- Écran d'entrée ---- */
  .login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--cream);
    padding: 24px;
  }
  .login-form { width: 360px; display: flex; flex-direction: column; gap: 24px; }
  .login-head { display: flex; flex-direction: column; gap: 8px; }
  .login-field { display: flex; flex-direction: column; gap: 8px; }
  .login-field label { font-size: 14px; font-weight: 500; color: var(--ink); }
  .login-field input {
    height: 48px;
    padding: 0 16px;
    background: var(--field-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-family: var(--font-body);
    font-size: 16px;
    color: var(--ink);
    width: 100%;
  }
  .login-error { font-size: 13px; color: var(--error); }
  .login-submit {
    height: 48px;
    border: none;
    border-radius: 14px;
    background: var(--terracotta);
    color: var(--cream);
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 120ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  .login-submit:hover { background: #B54F33; }
  .login-submit:active { opacity: 0.88; }

  /* ---- Barre supérieure ---- */
  .topbar {
    height: 64px;
    display: flex;
    align-items: center;
    gap: 40px;
    padding: 0 40px;
    border-bottom: 1px solid var(--border);
    background: var(--cream);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .topbar-brand { display: flex; align-items: baseline; gap: 12px; }
  .topbar-brand .wordmark { font-size: 20px; }
  .topbar-brand .eyebrow { font-size: 11px; }
  .topbar nav { display: flex; gap: 24px; height: 100%; }
  .tab {
    border: none;
    background: none;
    cursor: pointer;
    padding: 0;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-soft);
    border-bottom: 2px solid transparent;
    height: 100%;
  }
  .tab.is-active { color: var(--ink); border-bottom-color: var(--olive-deep); }
  .topbar-logout { margin-left: auto; }
  .topbar-logout a { font-size: 13px; }

  main { max-width: 1040px; margin: 0 auto; padding: 40px; }

  /* ---- Barre de filtres ---- */
  .toolbar {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 40px;
  }
  .range-shortcuts {
    display: flex;
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .range-shortcuts button {
    border: none;
    cursor: pointer;
    padding: 9px 16px;
    font-size: 13px;
    font-weight: 500;
    background: transparent;
    color: var(--ink-soft);
    border-right: 1px solid var(--border);
  }
  .range-shortcuts button:last-child { border-right: none; }
  .range-shortcuts button.is-active { background: var(--sand); color: var(--ink); }
  .range-dates { display: flex; align-items: center; gap: 8px; }
  .range-dates span { font-size: 13px; color: var(--ink-soft); }
  .toolbar input[type="date"],
  .toolbar select {
    height: 38px;
    padding: 0 12px;
    background: var(--field-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    font-family: var(--font-body);
    font-size: 13px;
    color: var(--ink);
  }
  .toolbar select { cursor: pointer; }

  /* ---- Vue Statistiques ---- */
  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 24px;
    margin-bottom: 48px;
  }
  .kpi-card {
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    background: var(--surface-raised);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .kpi-card .eyebrow { font-size: 11px; }
  .kpi-value {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 36px;
    line-height: 1.15;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  .section-title { font-size: 22px; margin-bottom: 16px; }

  .data-table {
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    background: var(--cream);
  }
  .table-head {
    padding: 12px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-raised);
  }
  .table-head .eyebrow { font-size: 11px; }
  .table-row {
    padding: 14px 24px;
    border-bottom: 1px solid rgba(214, 205, 185, 0.5);
    align-items: baseline;
  }
  .data-table > :last-child { border-bottom: none; }
  .cell-right { text-align: right; }

  .stats-table .table-head,
  .stats-table .table-row { display: grid; grid-template-columns: 1fr 120px 120px 140px; }
  .stats-table .row-name { font-size: 15px; font-weight: 500; color: var(--ink); }
  .stats-table .row-num { font-size: 15px; font-variant-numeric: tabular-nums; color: var(--ink); }
  .stats-table .table-row.is-inactive .row-name,
  .stats-table .table-row.is-inactive .row-num { color: var(--ink-placeholder); }

  /* ---- Vue Sessions ---- */
  .sessions-table .table-head,
  .sessions-table .table-row { display: grid; grid-template-columns: 200px 1fr 150px 100px 100px; }
  .sessions-table .table-row {
    cursor: pointer;
    transition: background 120ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  .sessions-table .table-row:hover { background: var(--surface-raised); }
  .sessions-table .row-date { font-size: 14px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .sessions-table .row-name { font-size: 15px; font-weight: 500; color: var(--ink); }
  .sessions-table .row-mode { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-soft); }
  .mode-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .mode-dot.is-entrainement { background: var(--olive-light); }
  .mode-dot.is-devoirs { background: var(--info); }
  .sessions-table .row-num { font-size: 14px; font-variant-numeric: tabular-nums; color: var(--ink); }
  .sessions-table .row-open { color: var(--ink-soft); }
  .table-empty { padding: 32px 24px; font-size: 14px; color: var(--ink-soft); }

  /* ---- Vue Lecteur de session ---- */
  .reader { max-width: 680px; margin: 0 auto; }
  .reader-back { font-size: 14px; }
  .reader-head {
    margin: 24px 0 40px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .reader-head h2 { font-size: 28px; }
  .reader-meta { font-size: 14px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  .timeline { display: flex; flex-direction: column; gap: 16px; padding-bottom: 64px; }

  .bubble-group { display: flex; flex-direction: column; gap: 4px; max-width: 78%; }
  .bubble-group.is-ari { align-items: flex-start; }
  .bubble-group.is-child { align-items: flex-end; align-self: flex-end; }
  .bubble-speaker {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .bubble {
    padding: 12px 16px;
    font-size: 15px;
    line-height: 1.5;
    color: var(--ink);
  }
  .bubble-group.is-ari .bubble {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 16px 16px 16px 4px;
  }
  .bubble-group.is-child .bubble {
    background: var(--sand);
    border-radius: 16px 16px 4px 16px;
  }

  .exercise-card {
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--cream);
    margin: 8px 0;
  }
  .exercise-summary {
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .exercise-card.is-expandable .exercise-summary { cursor: pointer; }
  .exercise-card.is-expandable .exercise-summary:hover { background: var(--surface-raised); border-radius: 11px; }
  .exercise-card.is-expandable.is-open .exercise-summary:hover { border-radius: 11px 11px 0 0; }
  .exercise-id { display: flex; flex-direction: column; gap: 2px; }
  .exercise-notion { font-size: 15px; font-weight: 600; color: var(--ink); }
  .exercise-meta { font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
  .exercise-end { display: flex; align-items: center; gap: 12px; flex: none; }
  .verdict {
    font-size: 13px;
    font-weight: 600;
    border: 1px solid currentColor;
    border-radius: 6px;
    padding: 3px 10px;
  }
  .verdict.is-success { color: var(--success); }
  .verdict.is-failure { color: var(--error); }
  .exercise-caret {
    width: 8px;
    height: 8px;
    border-right: 1.5px solid var(--ink-soft);
    border-bottom: 1.5px solid var(--ink-soft);
    transform: rotate(45deg) translateY(-2px);
    transition: transform 120ms cubic-bezier(0.4, 0, 0.2, 1);
  }
  .exercise-card.is-open .exercise-caret { transform: rotate(225deg) translateY(-2px); }
  .exercise-detail {
    border-top: 1px solid rgba(214, 205, 185, 0.5);
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .exercise-detail .eyebrow { font-size: 11px; }
  .exercise-detail-block { display: flex; flex-direction: column; gap: 4px; }
  .exercise-detail-block p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--ink); }
  .exercise-detail-block.is-visual p { color: var(--ink-soft); font-style: italic; }

  .mastery-divider { display: flex; align-items: center; gap: 16px; margin: 4px 0; }
  .mastery-divider::before,
  .mastery-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .mastery-label { flex: none; font-size: 13px; color: var(--ink-soft); }
  .mastery-label .mastery-notion { color: var(--ink); font-weight: 500; }
  .mastery-label .mastery-to { color: var(--olive-deep); font-weight: 600; }

  /* ---- Ajustements écrans étroits ---- */
  @media (max-width: 900px) {
    .topbar { padding: 0 24px; gap: 24px; }
    main { padding: 24px; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
    .sessions-table .table-head,
    .sessions-table .table-row { grid-template-columns: 150px 1fr 130px 80px 80px; }
  }
</style>
</head>
<body>

<!-- ===================== Écran d'entrée ===================== -->
<div id="login-screen" class="login-screen">
  <form id="login-form" class="login-form">
    <div class="login-head">
      <div class="wordmark" style="font-size: 28px;">Aristocles</div>
      <div class="eyebrow">Suivi des testeurs · outil interne</div>
    </div>
    <div class="login-field">
      <label for="pw">Mot de passe</label>
      <input id="pw" type="password" autocomplete="current-password" autofocus>
      <div id="login-error" class="login-error" hidden>Veuillez saisir le mot de passe.</div>
    </div>
    <button type="submit" class="login-submit">Entrer</button>
  </form>
</div>

<!-- ===================== Application ===================== -->
<div id="app" hidden>
  <header class="topbar">
    <div class="topbar-brand">
      <span class="wordmark">Aristocles</span>
      <span class="eyebrow">Suivi des testeurs</span>
    </div>
    <nav>
      <button id="tab-stats" class="tab" type="button">Statistiques</button>
      <button id="tab-sessions" class="tab" type="button">Sessions</button>
    </nav>
    <div class="topbar-logout">
      <a id="logout-link" href="#">Se déconnecter</a>
    </div>
  </header>

  <main>
    <!-- Filtres temporels (stats + sessions) -->
    <div id="toolbar" class="toolbar">
      <div id="range-shortcuts" class="range-shortcuts">
        <button type="button" data-range="hier">Hier</button>
        <button type="button" data-range="7d">7 jours</button>
        <button type="button" data-range="30d">30 jours</button>
        <button type="button" data-range="tout">Tout</button>
      </div>
      <div class="range-dates">
        <input id="date-from" type="date" aria-label="Date de début">
        <span>→</span>
        <input id="date-to" type="date" aria-label="Date de fin">
      </div>
      <select id="child-filter" aria-label="Filtrer par enfant" hidden></select>
    </div>

    <!-- Vue Statistiques -->
    <section id="view-stats" hidden>
      <div id="kpi-grid" class="kpi-grid"></div>
      <h2 class="section-title">Par enfant</h2>
      <div id="stats-table" class="data-table stats-table"></div>
    </section>

    <!-- Vue Sessions -->
    <section id="view-sessions" hidden>
      <h2 id="sessions-title" class="section-title"></h2>
      <div id="sessions-table" class="data-table sessions-table"></div>
    </section>

    <!-- Vue Lecteur de session -->
    <section id="view-reader" hidden>
      <div class="reader">
        <a id="reader-back" class="reader-back" href="#">← Retour aux sessions</a>
        <div class="reader-head">
          <h2 id="reader-name"></h2>
          <div id="reader-meta" class="reader-meta"></div>
        </div>
        <div id="timeline" class="timeline"></div>
      </div>
    </section>
  </main>
</div>

<script src="mock.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
